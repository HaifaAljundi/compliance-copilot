name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# The offline suite is the point of this workflow: routing, reducers, query
# cleaning, and the webhook retry/idempotency policy all fail *silently* rather
# than loudly, so they are exactly the tests worth running on every push. The
# integration tests are deselected here — they need live pgvector, Ollama and
# Groq, none of which belong in CI.
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent

    steps:
      # Pinned to exact release tags, matching this repo's convention for
      # images and dependencies. setup-uv publishes no moving `v9` alias.
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: agent/uv.lock
          python-version: "3.11"

      # --locked fails rather than silently re-resolving if uv.lock has drifted
      # from pyproject.toml. Direct dependencies are pinned exactly in
      # pyproject.toml; the lock is what pins the transitives, so CI runs the
      # same dependency graph twice in a row.
      - name: Install
        run: uv sync --locked --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Test (offline only)
        # Collection imports every test module, including the integration ones,
        # and app.config declares its secrets as required fields. Dummy values
        # satisfy import without touching any real service.
        env:
          PGVECTOR_PASSWORD: ci-dummy
          GROQ_API_KEY: ci-dummy
          N8N_WEBHOOK_SECRET: ci-dummy
          AGENT_API_KEY: ci-dummy
        run: uv run pytest -m 'not integration'
